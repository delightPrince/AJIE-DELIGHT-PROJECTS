<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARE - Modern Landing Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          ellipse at 75% 10%,
          #093838 0%,
          transparent 42%
        ),
        radial-gradient(
          ellipse at 10% 85%,
          #0639b9 2%,
          transparent 48%
        ),
        linear-gradient(135deg, #dce3e7, #b7dce8);
    }
    .container {
      width: 100%;
      max-width: 1260px;
      padding: 35px;
      background: #f9f9fa;
    }

    .navbar {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      padding: 15px 30px;
      margin-bottom: 27px;
      background: #ffffff;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #ff0000;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 38px;
    }

    .nav-links a,
    .login {
      color: #171717;
      font-size: 20px;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-links a:hover,
    .login:hover {
      opacity: 0.6;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .get-started {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      padding: 0 38px;
      border-radius: 40px;
      background: #000000;
      color: white;
      font-size: 19px;
      text-decoration: none;
      white-space: nowrap;
    }
    .cards {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1.12fr;
      gap: 24px;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      min-height: 275px;
      padding: 32px 35px;
    }

    .card h2,
    .card h3,
    .card p {
      position: relative;
      z-index: 2;
    }

    .card h2 {
      font-size: clamp(30px, 3.1vw, 58px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -1.8px;
      margin-bottom: 25px;
    }

    .card h3 {
      font-size: clamp(30px, 3vw, 48px);
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: -1.2px;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 20px;
      line-height: 1.4;
    }
    .purchase-card {
      min-height: 580px;
      background: #64e8eb;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .purchase-card h2 {
      max-width: 440px;
    }

    .purchase-card p {
      max-width: 280px;
    }

    .purchase-actions {
      position: absolute;
      z-index: 3;
      left: 28px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .plan-button,
    .arrow-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 65px;
      border: 0;
      border-radius: 50px;
      background: #000;
      color: white;
      text-decoration: none;
    }

    .plan-button {
      padding: 0 28px;
      font-size: 18px;
      white-space: nowrap;
    }

    .arrow-button {
      width: 65px;
      font-size: 34px;
    }
    .blue-shape {
      position: absolute;
      width: 300px;
      height: 190px;
      right: -45px;
      bottom: 90px;
      border-radius: 55% 45% 48% 52%;
      transform: rotate(-28deg);
      background: linear-gradient(
        135deg,
        #48e7ee 0%,
        #149ce7 35%,
        #0750c8 70%,
        #101b75 100%
      );
      box-shadow: inset 12px 10px 24px
        rgba(255, 255, 255, 0.25);
    }

    .blue-shape::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      right: -5px;
      top: 40px;
      background: linear-gradient(
        135deg,
        #092b91,
        #176fe0,
        #24c5ed
      );
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
    }
    .middle-column {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 24px;
    }

    .blog-card {
      min-height: 0;
      background: #6da348;
    }

    .contact-card {
      min-height: 0;
      background: #2f9191;
    }

    .card-arrow {
      position: absolute;
      right: 30px;
      bottom: 25px;
      z-index: 3;
      color: #000;
      font-size: 38px;
      line-height: 1;
      text-decoration: none;
    }
    .trust-card {
      min-height: 580px;
      background: #1c99ca;
    }

    .trust-card h3 {
      max-width: 280px;
      margin-bottom: 18px;
    }

    .trust-card p {
      margin-top: 0;
    }
    .sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        circle at 32% 25%,
        #c5ffff 0%,
        #8be7f1 23%,
        #60c7e2 45%,
        #a1b8f4 70%,
        #6e71cb 100%
      );
      box-shadow:
        inset -10px -14px 22px rgba(51, 70, 174, 0.2),
        inset 8px 8px 18px rgba(255, 255, 255, 0.5),
        0 18px 20px rgba(72, 91, 167, 0.2);
    }

    .sphere-large {
      width: 180px;
      height: 180px;
      top: 48%;
      left: 28%;
    }

    .sphere-small {
      width: 100px;
      height: 100px;
      top: 29%;
      right: -25px;
    }

    @media (max-width: 1000px) {
      .container {
        padding: 22px;
      }

      .navbar {
        flex-wrap: wrap;
        padding: 20px;
      }

      .nav-links {
        gap: 20px;
      }

      .nav-links a,
      .login {
        font-size: 16px;
      }

      .get-started {
        min-height: 48px;
        padding: 0 22px;
        font-size: 16px;
      }

      .cards {
        grid-template-columns: 1.2fr 1fr;
      }

      .purchase-card {
        min-height: 520px;
      }

      .trust-card {
        grid-column: 1 / -1;
        min-height: 400px;
      }

      .middle-column {
        min-height: 520px;
      }
    
    @media (max-width: 600px) {
      body {
        padding: 18px 12px;
        align-items: flex-start;
      }

      .container {
        padding: 12px;
      }

      .navbar {
        gap: 20px;
        margin-bottom: 15px;
      }

      .logo {
        font-size: 24px;
      }

      .nav-links {
        width: 100%;
        flex-wrap: wrap;
        gap: 15px;
      }

      .nav-actions {
        width: 100%;
        justify-content: space-between;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .purchase-card {
        min-height: 490px;
        padding: 25px;
      }

      .purchase-card h2 {
        font-size: 39px;
      }

      .middle-column {
        min-height: 420px;
        gap: 15px;
      }

      .blog-card,
      .contact-card {
        min-height: 200px;
        padding: 25px;
      }

      .trust-card {
        grid-column: auto;
        min-height: 440px;
        padding: 25px;
      }

      .sphere-large {
        width: 155px;
        height: 155px;
      }

      .purchase-actions {
        left: 20px;
        bottom: 20px;
        gap: 10px;
      }

      .plan-button {
        padding: 0 20px;
        font-size: 15px;
      }

      .arrow-button {
        width: 55px;
        min-height: 55px;
      }

      .blue-shape {
        width: 250px;
        height: 155px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Navigation -->
    <nav class="navbar">
      <a href="#" class="logo">CARE</a>

      <div class="nav-links">
        <a href="purchase.html">Platform</a>
        <a href="pricing.html">Pricing</a>
        <a href="trust.html">About</a>
        <a href="blog.html">Blog</a>
      </div>

      <div class="nav-actions">
        <a href="login page.html" class="login">Log in</a>
        <a href="purchase.html" class="get-started">
          Get Started
        </a>
      </div>
    </nav>
    <section class="cards">

      <article class="card purchase-card" id="purchase">
        <h2>
          How can you<br>
          purchase our<br>
          platform
        </h2>

        <p>
          Learn more about<br>
          the benefits
        </p>

        <div class="blue-shape"></div>

        <div class="purchase-actions">
          <a href="plan.html" class="plan-button">
            Choose your plan
          </a>

          <a href="choose.html" class="arrow-button"
             aria-label="Choose a plan">
            →
          </a>
        </div>
      </article>
      <div class="middle-column">

        <article class="card blog-card" id="blog">
          <h3>Blog</h3>
          <p>Read our articles</p>

          <a href="#" class="card-arrow"
             aria-label="Read our articles">
            →
          </a>
        </article>

        <article class="card contact-card">
          <h3>Contact</h3>
          <p>Write any question</p>

          <a href="#" class="card-arrow"
             aria-label="Contact us">
            →
          </a>
        </article>

      </div>
      <article class="card trust-card" id="trust">
        <h3>People<br>trust us</h3>
        <p>Find out why</p>

        <div class="sphere sphere-large"></div>
        <div class="sphere sphere-small"></div>

        <a href="#" class="card-arrow"
           aria-label="Find out why people trust us">
          →
        </a>
      </article>

    </section>

  </main>

</body>
</html>
